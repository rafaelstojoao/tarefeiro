<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Tarefeiro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tarefeiro">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark border-bottom border-secondary-subtle">
  <div class="container" style="max-width:480px;">
    <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="offcanvas" data-bs-target="#main-menu">☰</button>
    <span class="navbar-brand mb-0 h1">Tarefeiro</span>
    <button class="btn btn-sm btn-outline-secondary" id="notif-btn" title="Ativar avisos">🔔</button>
  </div>
</nav>

<div class="offcanvas offcanvas-start" tabindex="-1" id="main-menu">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Tarefeiro</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body d-flex flex-column">
    <a href="index.html" class="btn btn-secondary text-start mb-2">📅 Calendário</a>
    <a href="list.html" class="btn btn-outline-secondary text-start mb-2">📋 Lista de tarefas</a>
    <button class="btn btn-outline-danger text-start mt-auto" id="logout-btn">Sair</button>
  </div>
</div>

<main class="container py-3" style="max-width:480px; padding-bottom:100px;">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <button class="btn btn-sm btn-outline-secondary" id="cal-prev">‹</button>
    <h5 class="mb-0" id="cal-month-label"></h5>
    <button class="btn btn-sm btn-outline-secondary" id="cal-next">›</button>
  </div>

  <div class="calendar-weekdays">
    <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
  </div>
  <div class="calendar-grid" id="calendar-grid"></div>

  <div class="mt-4">
    <h6 class="text-secondary" id="selected-day-label">Hoje</h6>
    <ul class="list-group" id="day-task-list"></ul>
    <p class="text-center text-secondary mt-4" id="day-empty-state" hidden>Nenhuma tarefa com prazo neste dia.</p>
  </div>
</main>

<button class="btn btn-primary fab" id="add-task-btn" data-bs-toggle="modal" data-bs-target="#task-modal">+</button>

<!-- Modal de criar/editar tarefa -->
<div class="modal fade" id="task-modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="task-form">
        <div class="modal-header">
          <h5 class="modal-title" id="task-modal-title">Nova tarefa</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="task-id">
          <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" class="form-control" id="task-title" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Descrição</label>
            <textarea class="form-control" id="task-description" rows="2"></textarea>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Prioridade</label>
              <select class="form-select" id="task-priority">
                <option value="baixa">Baixa</option>
                <option value="media" selected>Média</option>
                <option value="alta">Alta</option>
              </select>
            </div>
            <div class="col mb-3">
              <label class="form-label">Prazo</label>
              <input type="date" class="form-control" id="task-due-date">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Horário (opcional)</label>
            <input type="time" class="form-control" id="task-due-time">
          </div>
          <div class="form-check mb-2">
            <input type="checkbox" class="form-check-input" id="task-reminder-toggle">
            <label class="form-check-label" for="task-reminder-toggle">Me avisar antes do prazo</label>
          </div>
          <div class="row" id="task-reminder-fields" hidden>
            <div class="col mb-3">
              <label class="form-label">Antecedência</label>
              <input type="number" class="form-control" id="task-reminder-amount" min="1" value="30">
            </div>
            <div class="col mb-3">
              <label class="form-label">Unidade</label>
              <select class="form-select" id="task-reminder-unit">
                <option value="minutos">Minutos</option>
                <option value="horas">Horas</option>
                <option value="dias">Dias</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/calendar.js"></script>
</body>
</html>
